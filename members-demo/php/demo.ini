auto_prepend_file=/opt/demo/prepend-demo.php
expose_php=0
display_errors=0
log_errors=1
allow_url_fopen=0
allow_url_include=0
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
session.cookie_samesite=Lax
session.gc_maxlifetime=14400
upload_max_filesize=10M
post_max_size=12M
; Block PHP mail() and shell helpers. stream_socket_client stays available so the
; demo can hand messages to the local Mailpit catcher. The demo guard refuses
; any SMTP host other than mailpit, with no username and no password.
disable_functions=mail,exec,shell_exec,system,passthru,proc_open,popen,fsockopen,pfsockopen
